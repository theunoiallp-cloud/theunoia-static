<main class="contact">
  <svg class="bg-lines" aria-hidden="true" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <g fill="none" stroke="#FAF7F0" stroke-width="1.2">
      <path d="M-60 520 C 180 420, 360 640, 620 540 S 1040 380, 1500 500"/>
      <path d="M-60 560 C 200 460, 380 690, 640 590 S 1060 420, 1500 540"/>
      <path d="M-60 600 C 220 500, 400 740, 660 640 S 1080 460, 1500 580"/>
      <path d="M-60 300 C 240 220, 420 380, 700 300 S 1120 160, 1500 260"/>
      <path d="M-60 340 C 260 260, 440 420, 720 340 S 1140 200, 1500 300"/>
      <circle cx="260" cy="780" r="180"/>
      <circle cx="260" cy="780" r="240"/>
      <circle cx="1260" cy="120" r="200"/>
    </g>
  </svg>

  <div class="wrap">
    <section class="intro">
      <h1>Contact Us</h1>
      <p>Not sure what you need? The team at THEUNOiA will be happy to listen and help you find student talent you hadn’t considered.</p>

      <div class="details">
        <div>
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C9A227" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          <a href="mailto:howdy@theunoia.com">howdy@theunoia.com</a>
        </div>
        <div>
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C9A227" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
          <a href="tel:+916374214583">Support: +91 63742 14583</a>
        </div>
      </div>
    </section>

    <section class="card">
      <svg class="arcs" aria-hidden="true" width="190" height="190" viewBox="0 0 190 190">
        <g fill="none" stroke="#C9A227" stroke-width="2" opacity="0.55">
          <circle cx="160" cy="30" r="150"/>
          <circle cx="160" cy="30" r="122"/>
          <circle cx="160" cy="30" r="92"/>
        </g>
      </svg>

      <h2>We’d love to hear from you!<br>Let’s get in touch</h2>

      <form id="contact-form" novalidate>
        <div class="field">
          <label for="fullname">Full Name</label>
          <input id="fullname" name="fullname" type="text" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="company">Company</label>
          <input id="company" name="company" type="text" autocomplete="organization">
        </div>

        <div class="field">
          <label for="email">Email</label>
          <div class="with-icon">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6559" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required>
          </div>
        </div>

        <div class="field">
          <label for="phone">Phone number</label>
          <div class="phone">
            <select id="country" name="country" aria-label="Country code">
              <option value="+91">IN</option>
              <option value="+1">US</option>
              <option value="+44">UK</option>
              <option value="+971">AE</option>
            </select>
            <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+91 98765 43210">
          </div>
        </div>

        <div class="field full">
          <label for="address">Address</label>
          <input id="address" name="address" type="text" autocomplete="street-address">
        </div>

        <div class="field full">
          <label for="message">Your Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Type your message here" required></textarea>
        </div>

        <div class="actions full">
          <button class="send" type="submit">Send Message</button>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </div>
      </form>
    </section>
  </div>
</main>
